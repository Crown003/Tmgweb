{% extends "base.html" %}
{% block title %} Edit Team {% endblock %}
{% block body %}
<main class="w-full min-h-[85vh] flex items-center justify-center px-4 py-20 relative overflow-hidden">
	<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_rgba(220,38,38,0.04)_0%,_transparent_60%)]"></div>

	<div class="relative z-10 w-full max-w-2xl">
		<a href="{% url 'UserProfile' %}" class="inline-flex items-center gap-2 text-sm text-zinc-500 hover:text-white transition-colors mb-8 group">
			<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="group-hover:-translate-x-0.5 transition-transform"><path d="m15 18-6-6 6-6"/></svg>
			Back to Profile
		</a>

		<div class="bg-zinc-900/60 border border-zinc-800/60 rounded-2xl p-8 sm:p-10 backdrop-blur-sm">
			<h2 class="text-2xl font-bold text-white mb-6">Edit Team Details</h2>
			
			<form action="#" method="POST" class="space-y-4 [&_input]:w-full [&_input]:px-4 [&_input]:py-2.5 [&_input]:rounded-xl [&_input]:bg-zinc-950 [&_input]:border [&_input]:border-zinc-800 [&_input]:text-white [&_input]:focus:outline-none [&_input]:focus:border-red-500/50 [&_input]:focus:ring-1 [&_input]:focus:ring-red-500/30 [&_label]:block [&_label]:text-xs [&_label]:font-semibold [&_label]:text-zinc-400 [&_label]:uppercase [&_label]:tracking-wider [&_label]:mb-1.5 [&_select]:w-full [&_select]:px-4 [&_select]:py-2.5 [&_select]:rounded-xl [&_select]:bg-zinc-950 [&_select]:border [&_select]:border-zinc-800 [&_select]:text-white [&_select]:focus:outline-none [&_select]:focus:border-red-500/50 [&_textarea]:w-full [&_textarea]:px-4 [&_textarea]:py-2.5 [&_textarea]:rounded-xl [&_textarea]:bg-zinc-950 [&_textarea]:border [&_textarea]:border-zinc-800 [&_textarea]:text-white [&_textarea]:focus:outline-none [&_textarea]:focus:border-red-500/50">
				{% csrf_token %}
				{{ form.as_p }}
				
				{% if teamDetailForm %}
				<div class="border-t border-zinc-800 pt-6 mt-6 space-y-4">
					<h3 class="text-sm font-bold text-white uppercase tracking-wider">Player Details</h3>
					{{ teamDetailForm.as_p }}
				</div>
				{% endif %}

				<div class="pt-4 flex justify-between items-center border-t border-zinc-800 mt-6">
					<a href="{% url 'UserProfile' %}" class="text-sm text-zinc-500 hover:text-white transition-colors">Cancel</a>
					<button type="submit" class="px-8 py-2.5 rounded-full text-sm font-semibold text-white bg-red-600 hover:bg-red-700 transition-colors">Save Changes</button>
				</div>
			</form>
		</div>
	</div>
</main>
{% endblock %}
{% block script %}
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var existingUsernames = [];
    var teamMemberNameFields = document.querySelectorAll('.player-name');

    // Debounce helper to restrict API calls while typing
    function debounce(func, delay) {
      let timeoutId;
      return function (...args) {
        if (timeoutId) clearTimeout(timeoutId);
        timeoutId = setTimeout(() => {
          func.apply(this, args);
        }, delay);
      };
    }

    teamMemberNameFields.forEach(function (teamMemberNameField) {
      var suggestionBox = document.createElement('div');
      suggestionBox.className = 'mt-1 rounded-lg bg-zinc-950 border border-zinc-800 overflow-hidden';
      teamMemberNameField.parentNode.appendChild(suggestionBox);

      const fetchSuggestions = debounce(function (inputValue) {
        // Real-time check: if input is cleared during debounce delay, abort
        if (teamMemberNameField.value.trim() === '') { suggestionBox.innerHTML = ''; return; }
        suggestionBox.innerHTML = '';
        var apiUrl = "{% url 'GetUser' %}?search=" + inputValue;
        fetch(apiUrl)
          .then(response => { if (!response.ok) throw new Error('Network error'); return response.json(); })
          .then(data => {
            // Re-verify input hasn't been cleared during network roundtrip
            if (teamMemberNameField.value.trim() === '') { suggestionBox.innerHTML = ''; return; }
            if (data.users.length > 0) {
              data.users.forEach(function (user) {
                var item = document.createElement('div');
                item.className = 'px-3 py-2 text-sm text-zinc-300 hover:bg-zinc-800 cursor-pointer transition-colors';
                item.textContent = user.name;
                if (!existingUsernames.includes(user.name.toLowerCase())) {
                  item.addEventListener('click', function () {
                    teamMemberNameField.value = user.name;
                    suggestionBox.innerHTML = '';
                    existingUsernames.push(user.name.toLowerCase());
                  });
                }
                suggestionBox.appendChild(item);
              });
            } else {
              suggestionBox.innerHTML = '<div class="px-3 py-2 text-sm text-zinc-500">No matching users found.</div>';
            }
          })
          .catch(error => console.error('Fetch error:', error));
      }, 300);

      teamMemberNameField.addEventListener('input', function (event) {
        var inputValue = event.target.value.trim().toLowerCase();
        if (inputValue === '') {
          suggestionBox.innerHTML = '';
        } else {
          fetchSuggestions(inputValue);
        }
      });

      if (teamMemberNameField.value.trim() !== '') {
        teamMemberNameField.addEventListener('focusout', function () {
          var val = teamMemberNameField.value.trim().toLowerCase();
          if (existingUsernames.includes(val)) { alert('Username already exists.'); teamMemberNameField.value = ''; return; }
          existingUsernames.push(val);
        });
      }
    });
  });
</script>
{% endblock %}
