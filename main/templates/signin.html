{% extends "base.html" %}
{% block title %} Sign In {% endblock %}
{% block body %}
<main class="w-full min-h-[85vh] flex items-center justify-center px-4 py-20 relative overflow-hidden bg-slate-50 dark:bg-[oklch(0%_0_0)] transition-colors">
	<!-- Premium BG -->
	<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_rgba(239,68,68,0.04)_0%,_transparent_60%)]"></div>

	<div class="relative z-10 w-full max-w-md">
		<!-- Back Button -->
		<a href="{% url 'Home' %}" class="inline-flex items-center gap-2 text-sm text-slate-500 dark:text-zinc-500 hover:text-slate-900 dark:hover:text-white transition-colors mb-8 group">
			<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="group-hover:-translate-x-0.5 transition-transform"><path d="m15 18-6-6 6-6"/></svg>
			Back
		</a>

		<div class="bg-white dark:bg-zinc-900/60 border border-slate-200 dark:border-zinc-800/60 rounded-2xl p-8 sm:p-10 shadow-xl dark:shadow-2xl backdrop-blur-sm">
			<div class="text-center mb-8">
				<h2 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white mb-2">Welcome Back</h2>
				<p class="text-sm text-slate-500 dark:text-zinc-500">Sign in to your TMG ESPORTS account.</p>
			</div>

			<form action="#" method="POST" class="space-y-5">
				{% csrf_token %}
				
				<div>
					<label class="block text-xs font-semibold text-slate-650 dark:text-zinc-400 uppercase tracking-wider mb-2">{{ signinform.username.label }}</label>
					<div class="[&_input]:w-full [&_input]:px-4 [&_input]:py-2.5 [&_input]:rounded-xl [&_input]:bg-slate-50 dark:[&_input]:bg-zinc-950 [&_input]:border [&_input]:border-slate-200 dark:[&_input]:border-zinc-800 [&_input]:text-slate-900 dark:[&_input]:text-white [&_input]:placeholder-slate-400 dark:[&_input]:placeholder-zinc-600 [&_input]:focus:outline-none [&_input]:focus:border-red-500/50 [&_input]:focus:ring-1 [&_input]:focus:ring-red-500/30 [&_input]:transition-colors">
						{{ signinform.username }}
					</div>
				</div>
				
				<div>
					<label class="block text-xs font-semibold text-slate-650 dark:text-zinc-400 uppercase tracking-wider mb-2">{{ signinform.password.label }}</label>
					<div class="[&_input]:w-full [&_input]:px-4 [&_input]:py-2.5 [&_input]:rounded-xl [&_input]:bg-slate-50 dark:[&_input]:bg-zinc-950 [&_input]:border [&_input]:border-slate-200 dark:[&_input]:border-zinc-800 [&_input]:text-slate-900 dark:[&_input]:text-white [&_input]:placeholder-slate-400 dark:[&_input]:placeholder-zinc-600 [&_input]:focus:outline-none [&_input]:focus:border-red-500/50 [&_input]:focus:ring-1 [&_input]:focus:ring-red-500/30 [&_input]:transition-colors">
						{{ signinform.password }}
					</div>
				</div>
				
				<div class="pt-2">
					<button type="submit" class="w-full py-3 rounded-full font-semibold text-white bg-red-600 hover:bg-red-700 transition-colors">
						Sign In
					</button>
				</div>
				
				<p class="text-center text-sm text-slate-500 dark:text-zinc-500 pt-2">
					Don't have an account? 
					<a href="{% url 'SignUp' %}" class="font-medium text-red-500 hover:text-red-400 transition-colors">Sign up</a>
				</p>
			</form>
		</div>
	</div>
</main>
{% endblock %}
